<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUVANA — Consulta de precios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap">
<style>
:root{--pink:#F5B9B8;--blush:#FCE6E4;--gold:#BF886B;--goldText:#8C5E45;--nude:#E8CDBE;--ink:#2F2828;--ivory:#FFF8F5;--line:#F1DDD3}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:Montserrat,Arial,sans-serif;font-size:15px}
header{background:var(--pink);padding:12px 16px 18px}
.top{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top img{height:64px;display:block}
.top h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:26px}
.tools{max-width:960px;margin:12px auto 0;display:flex;flex-direction:column;gap:10px}
.search{width:100%;min-height:48px;border-radius:24px;border:1px solid var(--ink);padding:0 20px;font:inherit;font-size:16px;background:var(--ivory);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ivory)}
select{min-height:40px;border-radius:20px;border:1px solid var(--ink);background:var(--ivory);padding:0 12px;font:inherit;font-size:13px;color:var(--ink)}
label.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;min-height:40px;cursor:pointer}
label.toggle input{width:20px;height:20px;accent-color:var(--ink)}
main{max-width:960px;margin:0 auto;padding:16px 16px 140px}
.count{font-size:13px;margin:4px 0 12px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center}
.thumb{width:88px;height:88px;border-radius:12px;overflow:hidden;background:var(--blush);display:flex;align-items:center;justify-content:center;border:0;padding:0;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.ph{cursor:default;font-family:'Cormorant Garamond',Georgia,serif;font-size:40px;color:var(--goldText)}
.lb{position:fixed;inset:0;background:rgba(47,40,40,.85);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;flex-direction:column;gap:12px}
.lb.open{display:flex}
.lb img{max-width:min(92vw,560px);max-height:70vh;border-radius:16px;background:#fff}
.lb p{color:var(--ivory);margin:0;text-align:center;font-size:16px}
.lb button{min-height:44px;padding:0 22px;border-radius:22px;border:1px solid var(--ivory);background:transparent;color:var(--ivory);font:inherit;font-weight:600;cursor:pointer}
.meta{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--goldText);font-weight:600}
.name{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;font-weight:600;line-height:1.15;margin:2px 0}
.price{font-size:22px;font-weight:600;text-align:right;white-space:nowrap}
.stock{font-size:12px}
.low{display:inline-block;background:var(--ink);color:#FBE2C8;font-size:11px;font-weight:600;letter-spacing:1px;padding:3px 10px;border-radius:12px;margin-left:6px}
.cost{font-size:12px;color:#5A4A4A}
.actions{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.dark{background:var(--ink);color:var(--ivory)}
.btn.wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.empty{padding:40px 0;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--ivory);padding:12px 16px;box-shadow:0 -8px 24px rgba(47,40,40,.25)}
.bar .in{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.bar .tot{font-size:15px}
.bar .tot b{font-size:20px;color:#FBE2C8}
.bar .btn{border-color:var(--ivory);color:var(--ivory)}
.bar .btn.wa{border-color:#2FA36B}
.panel{max-width:960px;margin:0 auto 8px;display:none;flex-direction:column;gap:6px;max-height:40vh;overflow:auto}
.panel.open{display:flex}
.pline{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;border-bottom:1px solid #4A3E3E;padding:6px 0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:16px;border:1px solid var(--ivory);background:transparent;color:var(--ivory);font-size:16px;cursor:pointer}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--ivory);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
@media (max-width:520px){.price{font-size:20px}.top img{height:52px}.thumb{width:72px;height:72px}.item{grid-template-columns:auto 1fr}.price{grid-column:2;text-align:left}}
</style>
</head>

  </div>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Buscar producto o marca… (ej: labial, bioaqua)" aria-label="Buscar producto o marca">
    <div class="row" role="group" aria-label="Categoría" id="cats"></div>
    <div class="row">
      <select id="sort" aria-label="Ordenar">
        <option value="name">Ordenar: nombre</option>
        <option value="low">Precio: menor a mayor</option>
        <option value="high">Precio: mayor a menor</option>
      </select>
          </div>
  </div>
</header>
<main>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
</main>
<div class="bar">
  <div class="panel" id="panel"></div>
  <div class="in">
    <div class="tot"><span id="nsel">0 productos en la oferta</span> · Total <b id="total">$0</b></div>
    <div class="row">
      <button class="btn" id="toggleP" type="button">Ver oferta</button>
      <button class="btn" id="copyAll" type="button">Copiar oferta</button>
      <a class="btn wa" id="waAll" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
      <button class="btn" id="clear" type="button">Vaciar</button>
    </div>
  </div>
</div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Foto del producto"><img id="lbImg" alt=""><p id="lbCap"></p><button type="button" id="lbClose">Cerrar</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const P = [{"n": "Mini contorno líquido 3D", "p": 7000, "u": 36, "m": "Karité", "cat": "Maquillaje", "f": "img/mini-contorno-liquido-3d.jpg"}, {"n": "Corrector de ojeras", "p": 8500, "u": 24, "m": "Romantic Rain", "cat": "Maquillaje", "f": "img/corrector-de-ojeras.jpg"}, {"n": "Polvo compacto control de grasa", "p": 16000, "u": 24, "m": "Karité", "cat": "Maquillaje", "f": "img/polvo-compacto-control-de-grasa.jpg"}, {"n": "Parches de colágeno para ojos con retinol", "p": 17000, "u": 1, "m": "Bioaqua", "cat": "Cuidado de la piel", "f": "img/parches-de-colageno-para-ojos-con-retinol.jpg"}, {"n": "Parches de colágeno para ojos baba de caracol", "p": 19000, "u": 1, "m": "Bioaqua", "cat": "Cuidado de la piel", "f": "img/parches-de-colageno-para-ojos-baba-de-caracol.jpg"}, {"n": "Bálsamo de labios Honey Peach", "p": 6000, "u": 2, "m": "Bioaqua", "cat": "Maquillaje", "f": "img/balsamo-de-labios-honey-peach.jpg"}, {"n": "Bálsamo de labios Grapefruit", "p": 6000, "u": 2, "m": "Bioaqua", "cat": "Maquillaje", "f": "img/balsamo-de-labios-grapefruit.jpg"}, {"n": "Bálsamo de labios Honey Miel", "p": 5000, "u": 6, "m": "Bioaqua", "cat": "Maquillaje", "f": "img/balsamo-de-labios-honey-miel.jpg"}, {"n": "Rubor líquido Rose Touch", "p": 14000, "u": 12, "m": "Kiss Beauty", "cat": "Maquillaje", "f": "img/rubor-liquido-rose-touch.jpg"}, {"n": "Rubor compacto", "p": 8000, "u": 12, "m": "Blush Powder", "cat": "Maquillaje", "f": "img/rubor-compacto.jpg"}, {"n": "Set de diademas para skincare + muñequeras", "p": 17000, "u": 6, "m": "Genérico", "cat": "Accesorio", "f": "img/set-de-diademas-para-skincare-munequeras.jpg"}, {"n": "Base BB Cream Perfect Cover", "p": 8000, "u": 12, "m": "Chanleevi", "cat": "Maquillaje", "f": "img/base-bb-cream-perfect-cover.jpg"}, {"n": "Balaca de maquillaje", "p": 8000, "u": 5, "m": "Genérico", "cat": "Accesorio", "f": "img/balaca-de-maquillaje.jpg"}, {"n": "Mascarilla velo facial", "p": 2000, "u": 30, "m": "Bioaqua", "cat": "Cuidado de la piel", "f": "img/mascarilla-velo-facial.jpg"}, {"n": "Lápiz de cejas 2 en 1 con cepillo", "p": 5000, "u": 6, "m": "Mila", "cat": "Maquillaje", "f": "img/lapiz-de-cejas-2-en-1-con-cepillo.jpg"}, {"n": "Lápiz delineador de labios", "p": 3000, "u": 10, "m": "Pink Key", "cat": "Maquillaje", "f": "img/lapiz-delineador-de-labios.jpg"}, {"n": "Pestañina Sky High", "p": 8000, "u": 6, "m": "Meike Glamour", "cat": "Maquillaje", "f": "img/pestanina-sky-high.jpg"}, {"n": "Fijador de maquillaje", "p": 15000, "u": 17, "m": "Billion Beauty", "cat": "Maquillaje", "f": "img/fijador-de-maquillaje.jpg"}, {"n": "Labial en barra con aceite de almendras", "p": 6000, "u": 23, "m": "Gul Flower", "cat": "Maquillaje", "f": "img/labial-en-barra-con-aceite-de-almendras.jpg"}, {"n": "Tinta de labios con moño", "p": 8000, "u": 24, "m": "Meike Glamour", "cat": "Maquillaje", "f": "img/tinta-de-labios-con-mono.jpg"}, {"n": "Set x3 de beauty blender", "p": 10000, "u": 5, "m": "Auty", "cat": "Maquillaje", "f": "img/set-x3-de-beauty-blender.jpg"}, {"n": "Kit de sérums antiedad", "p": 29000, "u": 3, "m": "Bioaqua", "cat": "Cuidado de la piel", "f": "img/kit-de-serums-antiedad.jpg"}, {"n": "Tónico facial hidratante de rosas", "p": 15000, "u": 8, "m": "Paulis", "cat": "Cuidado de la piel", "f": "img/tonico-facial-hidratante-de-rosas.jpg"}, {"n": "Cosmetiquera pequeña con cierre", "p": 15000, "u": 9, "m": "Genérico", "cat": "Accesorio", "f": "img/cosmetiquera-pequena-con-cierre.jpg"}, {"n": "Cosmetiquera Beautiful Secret", "p": 20000, "u": 1, "m": "Genérico", "cat": "Accesorio", "f": null}, {"n": "Parches anti acné de figuras", "p": 7000, "u": 3, "m": "Hanel", "cat": "Cuidado de la piel", "f": null}, {"n": "Parches anti acné invisibles", "p": 9000, "u": 7, "m": "Sadoer", "cat": "Cuidado de la piel", "f": "img/parches-anti-acne-invisibles.jpg"}, {"n": "Combo recargado retinol", "p": 55000, "u": 2, "m": "Bioaqua", "cat": "Cuidado de la piel", "f": null}, {"n": "Combo recargado ácido hialurónico", "p": 55000, "u": 1, "m": "Bioaqua", "cat": "Cuidado de la piel", "f": null}, {"n": "Combo recargado centella", "p": 55000, "u": 1, "m": "Bioaqua", "cat": "Cuidado de la piel", "f": null}, {"n": "Combo x4 de niacinamida", "p": 55000, "u": 1, "m": "Bioaqua", "cat": "Cuidado de la piel", "f": null}];
const fmt = n => '$' + Math.round(n).toLocaleString('es-CO');
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const CATS = ['Todo','Maquillaje','Cuidado de la piel','Accesorio'];
let cat = 'Todo', offer = {};
const $ = id => document.getElementById(id);

function store(){ try { localStorage.setItem('luvana-offer', JSON.stringify(offer)); } catch(e){} }
try { offer = JSON.parse(localStorage.getItem('luvana-offer') || '{}') || {}; } catch(e){ offer = {}; }

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1600); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('Mensaje copiado'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Mensaje copiado');}catch(_){toast('No se pudo copiar');} ta.remove(); }
}
const wa = text => 'https://wa.me/?text=' + encodeURIComponent(text);
function msgOne(p){
  return 'Hola, te comparto este producto de LUVANA Beauty & Care:\n\n' + p.n + ' (' + p.m + ')\nPrecio: ' + fmt(p.p) + '\n\n¿Te lo aparto? Tu belleza, tu esencia.';
}
function msgOffer(){
  const ids = Object.keys(offer); if(!ids.length) return '';
  let t = 'Hola, esta es tu oferta de LUVANA Beauty & Care:\n\n', tot = 0;
  ids.forEach(i => { const p=P[i], q=offer[i]; tot += p.p*q; t += '• ' + p.n + (q>1 ? ' x' + q : '') + ' — ' + fmt(p.p*q) + '\n'; });
  return t + '\nTotal: ' + fmt(tot) + '\n\n¿Te lo aparto? Tu belleza, tu esencia.';
}

function renderCats(){
  $('cats').innerHTML = '';
  CATS.forEach(c => { const b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=c==='Accesorio'?'Accesorios':c; b.setAttribute('aria-pressed', c===cat); b.onclick=()=>{cat=c; renderCats(); render();}; $('cats').appendChild(b); });
}
function render(){
  const q = norm($('q').value.trim()), show = false;
  let rows = P.map((p,i)=>({p,i})).filter(({p}) => (cat==='Todo'||p.cat===cat) && (!q || norm(p.n+' '+p.m+' '+p.cat).includes(q)));
  const s = $('sort').value;
  rows.sort((a,b)=> s==='low' ? a.p.p-b.p.p : s==='high' ? b.p.p-a.p.p : a.p.n.localeCompare(b.p.n,'es'));
  $('count').textContent = rows.length + (rows.length===1?' producto':' productos');
  const list = $('list'); list.innerHTML='';
  if(!rows.length){ list.innerHTML='<div class="empty">No encontré productos con esa búsqueda.</div>'; return; }
  rows.forEach(({p,i}) => {
    const d = document.createElement('div'); d.className='item';
    d.innerHTML =
      (p.f ? '<button type="button" class="thumb"><img loading="lazy" alt=""></button>' : '<div class="thumb ph" aria-hidden="true"></div>') +
      '<div><div class="meta"></div><div class="name"></div><div class="stock"></div>' + (show ? '<div class="cost"></div>' : '') + '</div>' +
      '<div class="price"></div>' +
      '<div class="actions"><button class="btn dark add" type="button"></button><button class="btn cp" type="button">Copiar mensaje</button><a class="btn wa" target="_blank" rel="noopener">WhatsApp</a></div>';
    d.querySelector('.meta').textContent = p.m + ' · ' + p.cat;
    d.querySelector('.name').textContent = p.n;
    if(p.f){ const th=d.querySelector('.thumb'); const im=th.querySelector('img'); im.src=p.f; im.alt=p.n; th.setAttribute('aria-label','Ver foto de '+p.n); th.onclick=()=>{ $('lbImg').src=p.f; $('lbImg').alt=p.n; $('lbCap').textContent=p.n+' · '+fmt(p.p); $('lb').classList.add('open'); $('lbClose').focus(); }; }
    else d.querySelector('.thumb').textContent = p.n.charAt(0);
    d.querySelector('.stock').innerHTML = p.u + ' disponibles' + (p.u<=3 ? '<span class="low">Últimas unidades</span>' : '');
    d.querySelector('.price').textContent = fmt(p.p);
    const add = d.querySelector('.add');
    add.textContent = offer[i] ? 'En la oferta (' + offer[i] + ') +' : 'Agregar a la oferta';
    add.setAttribute('aria-label', 'Agregar ' + p.n + ' a la oferta');
    add.onclick = () => { offer[i] = (offer[i]||0) + 1; store(); render(); renderBar(); toast('Agregado a la oferta'); };
    d.querySelector('.cp').onclick = () => copy(msgOne(p));
    d.querySelector('.wa').href = wa(msgOne(p));
    list.appendChild(d);
  });
}
function renderBar(){
  const ids = Object.keys(offer); let n=0, tot=0;
  const panel = $('panel'); panel.innerHTML='';
  ids.forEach(i => { const p=P[i], q=offer[i]; n+=q; tot+=p.p*q;
    const l=document.createElement('div'); l.className='pline';
    l.innerHTML='<span class="pn"></span><span class="qty"><button type="button" class="m" aria-label="Quitar uno">−</button><span class="qv"></span><button type="button" class="p" aria-label="Agregar uno">+</button><span class="pt"></span></span>';
    l.querySelector('.pn').textContent=p.n; l.querySelector('.qv').textContent=q; l.querySelector('.pt').textContent=fmt(p.p*q);
    l.querySelector('.m').onclick=()=>{ offer[i]--; if(offer[i]<=0) delete offer[i]; store(); renderBar(); render(); };
    l.querySelector('.p').onclick=()=>{ offer[i]++; store(); renderBar(); render(); };
    panel.appendChild(l);
  });
  if(!ids.length) panel.innerHTML='<div class="pline">Agrega productos con "Agregar a la oferta" para armar un pedido con total.</div>';
  $('nsel').textContent = n + (n===1?' producto':' productos') + ' en la oferta';
  $('total').textContent = fmt(tot);
  $('waAll').href = ids.length ? wa(msgOffer()) : '#';
}
$('toggleP').onclick = () => { const o=$('panel').classList.toggle('open'); $('toggleP').textContent = o ? 'Ocultar oferta' : 'Ver oferta'; };
$('copyAll').onclick = () => { const t=msgOffer(); if(!t) return toast('La oferta está vacía'); copy(t); };
$('waAll').onclick = e => { if(!Object.keys(offer).length){ e.preventDefault(); toast('La oferta está vacía'); } };
$('clear').onclick = () => { offer={}; store(); renderBar(); render(); };
$('q').oninput = render; $('sort').onchange = render;
$('lbClose').onclick=()=>$('lb').classList.remove('open');
$('lb').onclick=e=>{ if(e.target.id==='lb') $('lb').classList.remove('open'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('lb').classList.remove('open'); });
renderCats(); render(); renderBar();
</script>
</body>
</html>
